name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *" # refresh twice a day
  workflow_dispatch: # lets you run it manually
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1. You must check out the repository first so the deploy step has a Git context
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Generate the snake files
      - name: Generate snake from contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: LEGITKINGPIN # You can also use ${{ github.repository_owner }} here
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark
            dist/snake-purple.svg?color_snake=#a020f0&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      # 3. Push to output branch
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
