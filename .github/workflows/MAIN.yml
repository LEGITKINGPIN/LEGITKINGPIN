name: generate contribution tetris
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: yoshi389111/github-contribution-tetris@v1
        with:
          github_user_name: LEGITKINGPIN
          outputs: |
            dist/tetris.svg
            dist/tetris-dark.svg?palette=github-dark
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
