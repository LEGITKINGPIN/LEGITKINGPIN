name: Generate Galaga

on:
  schedule:
    - cron: "0 */12 * * *" # refresh twice a day
  workflow_dispatch: # lets you run it manually
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 1. Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Generate the Galaga SVGs
      - name: Generate Galaga game from contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'galaga' # This specific input triggers the Galaga game instead of Pac-Man

      # 3. Push to output branch
      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
